<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Daily Spend, Joined &amp; Enrolled — Reputable Health</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4/dist/chart.umd.min.js"></script>
<style>
  :root {
    --brand-lime: #C8E64A;
    --bg-body: #0a0a0a;
    --bg-surface: #1a1a1a;
    --text-main: #FFFFFF;
    --text-muted: #999999;
    --border-dark: rgba(255,255,255,0.08);
    --radius-lg: 16px;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg-body);
    color: var(--text-main);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 24px;
  }

  .chart-card {
    background: var(--bg-surface);
    border: 1px solid var(--border-dark);
    border-radius: var(--radius-lg);
    padding: 28px 24px;
    width: 100%;
    max-width: 1100px;
  }

  .chart-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 14px;
  }

  .chart-header h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--text-main);
    margin-bottom: 4px;
  }

  .chart-header .subtitle {
    font-size: 12px;
    color: #888;
  }

  .enrolled-badge {
    text-align: right;
  }

  .enrolled-badge .label {
    font-size: 11px;
    color: #888;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }

  .enrolled-badge .value {
    font-size: 32px;
    font-weight: 700;
    color: #34D399;
    line-height: 1.1;
  }

  .chart-wrap {
    position: relative;
    height: 340px;
  }

  .loading-msg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #888;
    font-size: 13px;
  }

  .error-msg {
    color: #FB7185;
    font-size: 13px;
    text-align: center;
    padding: 40px 0;
  }
</style>
</head>
<body>

<div class="chart-card">
  <div class="chart-header">
    <div>
      <h3>Daily Spend, Joined &amp; Enrolled (30d)</h3>
      <div class="subtitle">See whether spend changes drive joins and enrollment spikes</div>
    </div>
    <div class="enrolled-badge">
      <div class="label">Enrolled (30d)</div>
      <div class="value" id="enrolled-total">—</div>
    </div>
  </div>
  <div class="chart-wrap">
    <div class="loading-msg" id="loading">Loading data from API…</div>
    <canvas id="chart-recruiting"></canvas>
  </div>
</div>

<script>
(async function () {
  const PROXY_BASE = new URLSearchParams(window.location.search).get('proxy') || '';
  const DIRECT_API = 'https://operations.reputablehealth.net/api/recruiting';
  const API_BASE = PROXY_BASE ? `${PROXY_BASE}/api/recruiting` : DIRECT_API;
  const API_KEY = 'X5luAfkKBfDdrF0ITHMmIuntpmDKp0W2xyoxlVpFqWc';
  const DAYS = 30;

  const loadingEl = document.getElementById('loading');
  const canvas = document.getElementById('chart-recruiting');
  const enrolledEl = document.getElementById('enrolled-total');

  // --- Fetch API data ---
  let apiData = null;
  let metaAdsData = null;

  try {
    const headers = PROXY_BASE ? {} : { 'x-api-key': API_KEY };
    const [apiResp, metaResp] = await Promise.allSettled([
      fetch(`${API_BASE}?days=${DAYS}`, { headers }),
      fetch('./data/meta-ads-stats.json'),
    ]);

    if (apiResp.status === 'fulfilled' && apiResp.value.ok) {
      apiData = await apiResp.value.json();
    }
    if (metaResp.status === 'fulfilled' && metaResp.value.ok) {
      metaAdsData = await metaResp.value.json();
    }
  } catch (err) {
    console.warn('Fetch error:', err.message);
  }

  // --- Gather daily arrays ---
  const cutoff = new Date(Date.now() - DAYS * 86400000);

  // Spend: prefer local meta-ads JSON, fallback to API
  const allSpendDaily = metaAdsData?.daily?.length
    ? metaAdsData.daily
    : (apiData?.metaAds?.daily || []);
  const spendDaily = allSpendDaily.filter(d => new Date(d.date) >= cutoff);

  const onbData = apiData?.onboarding;
  const onbDaily = onbData?.daily || [];
  const joinedDaily = onbData?.joinedDaily || [];

  if (!spendDaily.length && !onbDaily.length) {
    loadingEl.textContent = 'No data available — check API connection.';
    loadingEl.classList.add('error-msg');
    loadingEl.classList.remove('loading-msg');
    return;
  }

  loadingEl.style.display = 'none';

  // --- Build date-keyed map ---
  const dateMap = {};
  spendDaily.forEach(d => {
    if (!dateMap[d.date]) dateMap[d.date] = { spend: 0, joined: 0, enrolled: 0 };
    dateMap[d.date].spend = d.spend || 0;
  });
  onbDaily.forEach(d => {
    if (!dateMap[d.date]) dateMap[d.date] = { spend: 0, joined: 0, enrolled: 0 };
    dateMap[d.date].enrolled = d.count ?? d.onboarded ?? 0;
  });
  joinedDaily.forEach(d => {
    if (!dateMap[d.date]) dateMap[d.date] = { spend: 0, joined: 0, enrolled: 0 };
    dateMap[d.date].joined = d.count ?? d.joined ?? 0;
  });

  const dates = Object.keys(dateMap).sort();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const labels = dates.map(d => {
    const dt = new Date(d + 'T00:00:00');
    return months[dt.getMonth()] + ' ' + dt.getDate();
  });

  const spendArr = dates.map(d => dateMap[d].spend);
  const joinedArr = dates.map(d => dateMap[d].joined);
  const enrolledArr = dates.map(d => dateMap[d].enrolled);

  // --- Enrolled total ---
  const enrolledTotal = enrolledArr.reduce((a, b) => a + b, 0);
  enrolledEl.textContent = enrolledTotal.toLocaleString();

  // --- Build datasets ---
  const datasets = [
    {
      label: 'Enrolled',
      data: enrolledArr,
      borderColor: '#34D399',
      backgroundColor: 'rgba(52,211,153,0.08)',
      fill: true,
      tension: 0.3,
      borderWidth: 2,
      pointRadius: 2,
      pointHoverRadius: 4,
      yAxisID: 'y',
    },
    {
      label: 'Spend ($)',
      data: spendArr,
      borderColor: '#6C5CE7',
      backgroundColor: 'rgba(108,92,231,0.05)',
      fill: false,
      tension: 0.3,
      borderWidth: 2,
      pointRadius: 2,
      pointHoverRadius: 4,
      yAxisID: 'y1',
    },
  ];

  if (joinedArr.some(v => v > 0)) {
    datasets.splice(1, 0, {
      label: 'Joined Study',
      data: joinedArr,
      borderColor: '#60A5FA',
      backgroundColor: 'rgba(96,165,250,0.05)',
      fill: false,
      tension: 0.3,
      borderWidth: 2,
      pointRadius: 2,
      pointHoverRadius: 4,
      yAxisID: 'y',
    });
  }

  // --- Render chart ---
  new Chart(canvas, {
    type: 'line',
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: {
          display: true,
          position: 'bottom',
          labels: {
            color: '#999',
            font: { size: 12 },
            padding: 16,
            usePointStyle: true,
            pointStyle: 'circle',
          },
        },
        tooltip: {
          titleFont: { size: 12 },
          bodyFont: { size: 12 },
          padding: 10,
          callbacks: {
            label: ctx => {
              const val = ctx.parsed.y;
              return ctx.dataset.label === 'Spend ($)'
                ? `Spend: $${val.toFixed(2)}`
                : `${ctx.dataset.label}: ${val}`;
            },
          },
        },
      },
      scales: {
        x: {
          ticks: { color: '#888', font: { size: 10 }, maxRotation: 45, autoSkip: true, maxTicksLimit: 20 },
          grid: { color: 'rgba(255,255,255,0.05)' },
        },
        y: {
          position: 'left',
          ticks: { color: '#888', font: { size: 11 } },
          grid: { color: 'rgba(255,255,255,0.05)' },
        },
        y1: {
          position: 'right',
          ticks: { color: '#888', font: { size: 11 }, callback: v => '$' + v },
          grid: { drawOnChartArea: false },
        },
      },
    },
  });
})();
</script>
</body>
</html>
