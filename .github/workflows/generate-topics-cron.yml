name: Generate Trending Topics

on:
  schedule:
    # Monday, Wednesday, Friday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trending-topic-generator/package-lock.json

      - name: Install dependencies
        working-directory: trending-topic-generator
        run: npm ci

      - name: Generate trending posts
        working-directory: trending-topic-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
        run: node scripts/generate-posts.mjs

      - name: Commit and push pending posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trending-topic-generator/queue/pending/
          if git diff --cached --quiet; then
            echo "No new posts to commit"
          else
            git commit -m "Add pending topic batch $(date +%Y-%m-%d)"
            git push
          fi
