name: Generate Trending Topics

on:
  schedule:
    # Monday, Wednesday, Friday at 7:00 AM EST (12:00 UTC)
    - cron: '0 12 * * 1,3,5'
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: trending-topic-generator/package-lock.json

      - name: Install dependencies
        working-directory: trending-topic-generator
        run: npm ci

      - name: Generate trending posts
        working-directory: trending-topic-generator
        env:
          ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
        run: node scripts/generate-posts.mjs

      - name: Commit and push pending posts
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add trending-topic-generator/queue/pending/
          if git diff --cached --quiet; then
            echo "No new posts to commit"
            echo "new_posts=false" >> "$GITHUB_OUTPUT"
          else
            POST_COUNT=$(git diff --cached --name-only | wc -l)
            git commit -m "Add pending topic batch $(date +%Y-%m-%d)"
            git push
            echo "new_posts=true" >> "$GITHUB_OUTPUT"
            echo "post_count=$POST_COUNT" >> "$GITHUB_OUTPUT"
          fi

      - name: Notify Slack on new posts
        if: steps.commit.outputs.new_posts == 'true'
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "New trending topics generated",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":sparkles: *${{ steps.commit.outputs.post_count }} new trending topics generated*\n\nNew posts are queued in `trending-topic-generator/queue/pending/` and ready for review.\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run> · <${{ github.server_url }}/${{ github.repository }}/tree/main/trending-topic-generator/queue/pending|View pending posts>"
                  }
                }
              ]
            }

      - name: Notify Slack on failure
        if: failure()
        continue-on-error: true
        uses: slackapi/slack-github-action@v2.1.0
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Topic generation failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":x: *Trending topic generation failed*\n\nThe scheduled topic generation job encountered an error.\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>"
                  }
                }
              ]
            }
