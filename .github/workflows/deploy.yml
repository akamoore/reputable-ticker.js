name: Deploy to GitHub Pages

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: trending-topic-generator/package-lock.json

      - name: Install and build
        working-directory: trending-topic-generator
        env:
          VITE_ANTHROPIC_API_KEY: ${{ secrets.VITE_ANTHROPIC_API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Prepare deploy directory
        run: |
          mkdir -p _site/trending-topic-generator
          cp -r trending-topic-generator/dist/* _site/trending-topic-generator/
          cp *.html _site/
          cp *.jpg _site/ 2>/dev/null || true
          cp *.pdf _site/ 2>/dev/null || true
          cp -r images _site/images 2>/dev/null || true
          cp -r docs _site/docs 2>/dev/null || true

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
